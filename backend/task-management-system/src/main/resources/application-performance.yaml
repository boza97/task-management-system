spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/tms_performance
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none

security:
  jwt:
    secret: performance-test-secret-key-long-enough-for-hmac-signing
    expiration-minutes: 60