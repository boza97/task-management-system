<div class="notification-bell">
  <button
    class="btn btn-sm btn-outline-light position-relative"
    type="button"
    (click)="toggle()"
    aria-label="Notifications"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      fill="currentColor"
      viewBox="0 0 16 16"
    >
      <path
        d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0
           1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7a5 5 0 0 0-4.005-4.901"
      />
    </svg>

    @if (unreadCount() > 0) {
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div class="notification-dropdown shadow">
      <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
        <span class="fw-semibold">Notifications</span>

        @if (unreadCount() > 0) {
          <button class="btn btn-link btn-sm p-0 text-decoration-none" (click)="markAllAsRead()">
            Mark all as read
          </button>
        }
      </div>

      <div class="notification-list">
        @for (notification of notifications(); track notification.id) {
          <button
            class="notification-item"
            [class.unread]="!notification.read"
            type="button"
            (click)="onNotificationClick(notification)"
          >
            <div class="small">{{ notification.message }}</div>
            <div class="text-muted" style="font-size: 0.75rem">
              {{ notification.createdAt | date: 'dd.MM.yyyy. HH:mm' }}
            </div>
          </button>
        } @empty {
          <div class="text-muted text-center small py-4">No notifications</div>
        }
      </div>
    </div>
  }
</div>
