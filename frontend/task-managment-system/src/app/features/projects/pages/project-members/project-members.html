<h4 class="mb-3">Project Members</h4>

<form class="mb-4 d-flex gap-2" [formGroup]="addForm" (ngSubmit)="addMember()">
  <select class="form-select" formControlName="userId">
    <option value="">Select user</option>
    @for (user of availableUsers(); track user.id) {
      <option [value]="user.id">{{ user.firstName }} {{ user.lastName }} ({{ user.email }})</option>
    }
  </select>

  <select class="form-select" formControlName="role">
    <option [value]="projectRoleEnum.DEVELOPER">Developer</option>
    <option [value]="projectRoleEnum.QA">QA</option>
    <option [value]="projectRoleEnum.PROJECT_MANAGER">Project Manager</option>
  </select>

  <button class="btn btn-primary" [disabled]="addForm.invalid">Add Member</button>
</form>

@if (loading()) {
  <div class="text-muted">Loading members...</div>
}

@if (!loading() && error()) {
  <div class="alert alert-danger">
    {{ error() }}
  </div>
}

@if (!loading() && !error()) {
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (m of members(); track m.userId) {
        <tr>
          <td>{{ m.firstName }} {{ m.lastName }}</td>
          <td>{{ m.email }}</td>
          <td>{{ m.role }}</td>
          <td class="text-end">
            <button
              class="btn btn-sm btn-outline-danger"
              [disabled]="m.userId === project()?.ownerId"
              (click)="removeMember(m.userId)"
            >
              Remove
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
