<div class="mb-3">
  <button class="btn btn-sm btn-outline-secondary" routerLink="/projects">← Projects</button>
</div>

<div class="container mt-4">
  @if (loading()) {
    <div class="spinner-border spinner-border-sm"></div>
  }

  @if (error()) {
    <div class="alert alert-danger">
      {{ error() }}
    </div>
  }

  @if (!loading() && project()) {
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="mb-3">
          <h4 class="mb-1">{{ project()!.key }} — {{ project()!.name }}</h4>

          <div class="text-muted small">Owner: {{ project()!.ownerFullName }}</div>
        </div>

        @if (project()!.description) {
          <div class="mb-3">
            {{ project()!.description }}
          </div>
        }

        <div class="text-muted small">Created: {{ project()!.createdAt | date: 'medium' }}</div>
      </div>
    </div>
  }
</div>
