<button class="btn btn-link px-0 mb-2 text-decoration-none" routerLink="../">
  ← Back to Tasks
</button>

<h4 class="mb-3">Create Task</h4>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input id="title" class="form-control" formControlName="title" />
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea id="description" class="form-control" formControlName="description"></textarea>
  </div>

  <div class="mb-3 width-200-px">
    <label for="priority" class="form-label">Priority</label>
    <select id="priority" class="form-select" formControlName="priority">
      <option [value]="taskPriorityEnum.LOW">Low</option>
      <option [value]="taskPriorityEnum.MEDIUM">Medium</option>
      <option [value]="taskPriorityEnum.HIGH">High</option>
      <option [value]="taskPriorityEnum.CRITICAL">Critical</option>
    </select>
  </div>

  <div class="mb-3 width-200-px">
    <label for="dueDate" class="form-label">Due Date</label>
    <input id="dueDate" type="date" class="form-control" formControlName="dueDate" />
  </div>

  <div class="mb-3 width-500-px">
    <label class="form-label" for="assignee"> Assignee </label>

    <select id="assignee" class="form-select" formControlName="assigneeId">
      <option [ngValue]="null">Unassigned</option>

      @for (m of members(); track m.userId) {
        <option [value]="m.userId">{{ m.firstName }} {{ m.lastName }} ({{ m.role }})</option>
      }
    </select>
  </div>

  <button class="btn btn-primary" [disabled]="loading() || form.invalid">Create Task</button>
</form>
