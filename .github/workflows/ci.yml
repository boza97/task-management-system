name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: detect changes summary
        run: |
          echo "## Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "- Backend changed: ${{ steps.filter.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend changed: ${{ steps.filter.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY

  backend:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/task-management-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test backend
        run: mvn -B clean verify

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Backend CI Summary
        if: always()
        run: |
          echo "## Backend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Maven build executed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests executed" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/task-managment-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/task-managment-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build --if-present

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Frontend CI Summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "- Build executed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests executed" >> $GITHUB_STEP_SUMMARY
